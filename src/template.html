<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>タイトル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+Mono&display=swap" rel="stylesheet">
<!-- DADS: tokens.css(全トークン) + global.css(セマンティック色・リンク・文字ユーティリティ)。使うコンポーネントの CSS だけ下に足す -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@digital-go-jp/design-tokens@2.1.0/dist/tokens.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/digital-go-jp/design-system-example-components-html@v20261021/src/global.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/digital-go-jp/design-system-example-components-html@v20261021/src/components/heading/heading.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/digital-go-jp/design-system-example-components-html@v20261021/src/components/button/button.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/digital-go-jp/design-system-example-components-html@v20261021/src/components/link/link.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/digital-go-jp/design-system-example-components-html@v20261021/src/components/table/table.css">
<style>
  /* ページ固有のレイアウトだけ書く。色・文字・角丸・影は DADS のトークン（var(--color-*) 等）から取る */
  body {
    margin: 0;
    color: var(--color-neutral-solid-gray-800);
    background: var(--color-neutral-white);
  }
  .page {
    max-width: calc(1024 / 16 * 1rem);
    margin: 0 auto;
    padding: calc(48 / 16 * 1rem) calc(24 / 16 * 1rem) calc(80 / 16 * 1rem);
    display: grid;
    gap: calc(32 / 16 * 1rem);
  }
  .page > * { margin: 0; }
</style>
</head>
<body>
<main class="page">
  <hgroup class="dads-heading" data-size="36">
    <h1 class="dads-heading__heading">ページタイトル</h1>
  </hgroup>

  <p class="dads-u-std-16N-170">本文。文字サイズと行間は dads-u-std-*/dads-u-dsp-* ユーティリティか var(--font-size-*) / var(--line-height-*) を使う。<a class="dads-link" href="https://design.digital.go.jp/dads/">リンク</a></p>

  <div>
    <button class="dads-button" data-size="md" data-type="solid-fill">主ボタン</button>
  </div>

  <div class="dads-table">
    <table class="dads-table__table" data-border="hidden" data-cell-border>
      <thead>
        <tr><th class="dads-table__col-header" scope="col">項目</th><th class="dads-table__col-header" scope="col">値</th></tr>
      </thead>
      <tbody>
        <tr><td>例</td><td>123</td></tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
